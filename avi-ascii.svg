"""
foto_para_ascii_svg.py

Converte uma foto em um retrato ASCII monocromatico, animado em LOOP
continuo (digita linha por linha, fica visivel, apaga e reinicia),
em formato SVG -- pronto pra usar no README do perfil do GitHub.
"""

from PIL import Image

# ============================================================
# >>> COLOQUE AQUI O CAMINHO/NOME DA SUA FOTO LOCAL <<<
CAMINHO_DA_FOTO = r"C:\Users\Rafael\OneDrive\Documentos\GithbubPerfil\WhatsApp Image 2026-03-18 at 11.38.30.jpeg"
# ============================================================

ARQUIVO_SAIDA = "avi-ascii.svg"
LARGURA_CARACTERES = 70          # Quantos caracteres de largura tera o retrato
RAMPA = " .:-=+*#%@"             # Do mais claro pro mais escuro
FONTE_TAMANHO = 8                # Tamanho da fonte no SVG (px)
ESPACAMENTO_LINHA = FONTE_TAMANHO * 1.1
COR_TEXTO = "#e0dada"            # Cor do texto (estilo terminal)
COR_FUNDO = "#212122"            # Fundo escuro estilo GitHub dark mode

# --- CONTROLES DO LOOP ANIMADO ---
ATRASO_ENTRE_LINHAS = 0.08       # Velocidade de "digitação" (segundos por linha)
TEMPO_VISIVEL = 8.0                # Segundos que a imagem inteira fica parada na tela
TEMPO_FADE_SAIDA = 0.6             # Segundos para apagar tudo no final do ciclo
PAUSA_ANTES_REINICIAR = 0.5        # Segundos de tela escura antes de começar de novo


def imagem_para_ascii(caminho, largura_chars):
    img = Image.open(caminho).convert("L")
    razao_altura = img.height / img.width
    # 0.55 compensa a proporcao vertical dos caracteres monospace
    altura_chars = max(1, int(largura_chars * razao_altura * 0.55))
    img = img.resize((largura_chars, altura_chars))

    linhas = []
    pixels = img.load()
    for y in range(altura_chars):
        linha = ""
        for x in range(largura_chars):
            brilho = pixels[x, y]
            indice = int((brilho / 255) * (len(RAMPA) - 1))
            linha += RAMPA[indice]
        linhas.append(linha)
    return linhas


def gerar_svg(linhas):
    largura_svg = LARGURA_CARACTERES * (FONTE_TAMANHO * 0.6) + 20
    altura_svg = len(linhas) * ESPACAMENTO_LINHA + 20

    # Tempo total que leva para digitar todas as linhas
    tempo_digitando = len(linhas) * ATRASO_ENTRE_LINHAS
    # Duração total de 1 ciclo completo da animação
    duracao_ciclo = tempo_digitando + TEMPO_VISIVEL + TEMPO_FADE_SAIDA + PAUSA_ANTES_REINICIAR

    # Pontos de controle em % do ciclo total (0% a 100%)
    pct_aparece = min(2.0, (0.05 / duracao_ciclo) * 100)
    pct_visivel_ate = ((tempo_digitando + TEMPO_VISIVEL) / duracao_ciclo) * 10
